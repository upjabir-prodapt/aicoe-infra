        - terraform/projects/aicoedev/**/*
        - terraform/modules/**/*

aicoedev_network_approve:
  stage: network_approve
  needs:
    - job: aicoedev_network_plan
      artifacts: false
  script:
    - echo "Network layer approved for apply"
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**/*
        - terraform/modules/**/*
aicoedev_network_apply:
  extends:
    - .wif_aicoedev
    - .terraform_apply
  stage: network_apply
  needs:
    - job: aicoedev_network_plan
      artifacts: true
    - job: aicoedev_network_approve
      artifacts: false
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: network
    TF_ENV: dev
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**/*
        - terraform/modules/**/*
###########################################
# ----------AICOE-DEV INFRA -------------##
###########################################
