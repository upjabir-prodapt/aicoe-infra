include:
  - local: .gitlab/ci/terraform-project.yml

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'

stages:
  - static_plan
  - static_approve
  - static_apply
  - network_plan
  - network_approve
  - network_apply
  - vector_psc_state_migration
  - infra_plan
  - infra_approve
  - infra_apply

variables:
  TF_REGION: europe-west1
###########################################
# ----------AICOE-DEV STATIC -------------#
###########################################
aicoedev_static_plan:
  extends:
    - .wif_aicoedev
    - .terraform_plan
  stage: static_plan
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: static
    TF_ENV: dev
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**/*
        - terraform/modules/**/*

aicoedev_static_approve:
  stage: static_approve
  needs:
    - job: aicoedev_static_plan
      artifacts: false
  script:
    - echo "Static layer approved for apply"
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**/*
        - terraform/modules/**/*

aicoedev_static_apply:
  extends:
    - .wif_aicoedev
    - .terraform_apply
  stage: static_apply
  needs:
    - job: aicoedev_static_plan
      artifacts: true
    - job: aicoedev_static_approve
      artifacts: false
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: static
    TF_ENV: dev
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**/*
        - terraform/modules/**/*
############################################
# -------- AICOE-DEV NETWORK --------------#
############################################
aicoedev_network_plan:
  extends:
    - .wif_aicoedev
    - .terraform_plan
  stage: network_plan
  needs:
    - job: aicoedev_static_apply
      artifacts: false
      optional: true
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: network
    TF_ENV: dev
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
