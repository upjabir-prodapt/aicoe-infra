aicoedev_infra_plan:
  extends:
    - .wif_aicoedev
    - .terraform_plan
  stage: infra_plan
  needs:
    - job: aicoedev_network_apply
      artifacts: false
      optional: true
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: infra
    TF_ENV: dev
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/infra/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version

aicoedev_infra_apply:
  extends:
    - .wif_aicoedev
    - .terraform_apply
  stage: infra_apply
  needs:
    - job: aicoedev_infra_plan
      artifacts: true
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: infra
    TF_ENV: dev
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/infra/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version
      when: manual