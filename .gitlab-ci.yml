include:
  - local: .gitlab/ci/terraform-project.yml

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'

stages:
  - static_plan
  - static_apply
  - network_plan
  - network_apply
  - infra_plan
  - infra_apply

variables:
  TF_REGION: europe-west1

# ---------------------------------------------------------------------------
# DEBUG JOB — run this first to confirm what terraform/projects/ actually
# contains in this branch's checkout. Remove once the path issue is resolved.
# ---------------------------------------------------------------------------
debug_show_terraform_tree:
  extends: .shell_runner
  stage: static_plan
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
  script:
    - |
      echo "==> Listing terraform/projects tree (up to 4 levels deep):"
      find terraform/projects -maxdepth 4 -type d 2>/dev/null || echo "terraform/projects does not exist at all"
      echo "==> Full repo top-level listing:"
      ls -la

aicoedev_static_plan:
  extends:
    - .wif_aicoedev
    - .terraform_plan
  stage: static_plan
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: static
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version

aicoedev_static_apply:
  extends:
    - .wif_aicoedev
    - .terraform_apply
  stage: static_apply
  needs:
    - job: aicoedev_static_plan
      artifacts: true
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: static
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version
      when: manual

aicoedev_network_plan:
  extends:
    - .wif_aicoedev
    - .terraform_plan
  stage: network_plan
  needs:
    - job: aicoedev_static_apply
      artifacts: false
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: network
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version

aicoedev_network_apply:
  extends:
    - .wif_aicoedev
    - .terraform_apply
  stage: network_apply
  needs:
    - job: aicoedev_network_plan
      artifacts: true
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: network
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version
      when: manual

aicoedev_infra_plan:
  extends:
    - .wif_aicoedev
    - .terraform_plan
  stage: infra_plan
  needs:
    - job: aicoedev_network_apply
      artifacts: false
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: infra
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version

aicoedev_infra_apply:
  extends:
    - .wif_aicoedev
    - .terraform_apply
  stage: infra_apply
  needs:
    - job: aicoedev_infra_plan
      artifacts: true
  variables:
    PROJECT_NAME: aicoedev
    TF_LAYER: infra
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoedev
    TFSTATE_BUCKET: aicoedev-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev-env"'
      changes:
        - terraform/projects/aicoedev/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version
      when: manual
 