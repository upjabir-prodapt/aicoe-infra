include:
  - local: .gitlab/ci/terraform-project.yml

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "sandbox-v1"'

stages:
  - static_plan
  - static_apply
  - network_plan
  - network_apply
  - infra_plan
  - infra_apply

variables:
  TF_REGION: europe-west1

aicoesandox_static_plan:
  extends: .terraform_plan
  stage: static_plan
  variables:
    PROJECT_NAME: aicoesandox
    TF_LAYER: static
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoesandox
    TFSTATE_BUCKET: aicoesandox-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "sandbox-v1"'
      changes:
        - terraform/projects/aicoesandox/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version

aicoesandox_static_apply:
  extends: .terraform_apply
  stage: static_apply
  needs:
    - job: aicoesandox_static_plan
      artifacts: true
  variables:
    PROJECT_NAME: aicoesandox
    TF_LAYER: static
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoesandox
    TFSTATE_BUCKET: aicoesandox-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "sandbox-v1"'
      changes:
        - terraform/projects/aicoesandox/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version
      when: manual

aicoesandox_network_plan:
  extends: .terraform_plan
  stage: network_plan
  needs:
    - job: aicoesandox_static_apply
      artifacts: false
  variables:
    PROJECT_NAME: aicoesandox
    TF_LAYER: network
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoesandox
    TFSTATE_BUCKET: aicoesandox-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "sandbox-v1"'
      changes:
        - terraform/projects/aicoesandox/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version

aicoesandox_network_apply:
  extends: .terraform_apply
  stage: network_apply
  needs:
    - job: aicoesandox_network_plan
      artifacts: true
  variables:
    PROJECT_NAME: aicoesandox
    TF_LAYER: network
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoesandox
    TFSTATE_BUCKET: aicoesandox-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "sandbox-v1"'
      changes:
        - terraform/projects/aicoesandox/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version
      when: manual

aicoesandox_infra_plan:
  extends: .terraform_plan
  stage: infra_plan
  needs:
    - job: aicoesandox_network_apply
      artifacts: false
  variables:
    PROJECT_NAME: aicoesandox
    TF_LAYER: infra
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoesandox
    TFSTATE_BUCKET: aicoesandox-bucket-tf-state
  rules:
    - if: '$CI_COMMIT_BRANCH == "sandbox-v1"'
      changes:
        - terraform/projects/aicoesandox/**
        - terraform/modules/**
        - .gitlab/ci/**
        - .terraform-version

aicoesandox_infra_apply:
  extends: .terraform_apply
  stage: infra_apply
  needs:
    - job: aicoesandox_infra_plan
      artifacts: true
  variables:
    PROJECT_NAME: aicoesandox
    TF_LAYER: infra
    TF_ENV: sandox
    TF_PROJECT: aicoe
    GCP_PROJECT_ID: aicoesandox
