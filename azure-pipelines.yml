trigger:
- main
pool:
  vmImage: 'ubuntu-latest' # Uses Microsoft's free hosted servers
variables:
  GCP_PROJECT_ID: '	aicoe-sharedwif'
  GCP_PROJECT_NUMBER: '538669417284' # 12-digit number
  GCP_SERVICE_ACCOUNT: 'aicoe-shared-wip-sa-tf@aicoe-sharedwif.iam.gserviceaccount.com'
  ADO_SERVICE_CONNECTION_NAME: 'sc-ado-gcp-aicoe' # Exact name of your Service Connection
  WIF_POOL_NAME: 'aicoe-ado-wip'
  WIF_PROVIDER_NAME: 'ado-gcp-wif'
steps:
- task: AzureCLI@2
  displayName: 'Passwordless WIF Authentication to GCP'
  inputs:
    azureSubscription: $(ADO_SERVICE_CONNECTION_NAME) 
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    addSpnToEnvironment: true # Crucial: injects the OIDC token into the $idToken variable
    inlineScript: |
      echo "Starting passwordless authentication to GCP..."

      # 1. Save the ADO OIDC token to a temporary file
      echo $idToken > $(System.DefaultWorkingDirectory)/oidc-token.txt

      ls -lrt $(System.DefaultWorkingDirectory)/oidc-token.txt
      
      echo "Create a dynmaic son configration file for WIF"

      # 2. Create the dynamic JSON configuration file for WIF
      gcloud iam workload-identity-pools create-cred-config \
        projects/$(GCP_PROJECT_NUMBER)/locations/global/workloadIdentityPools/$(WIF_POOL_NAME)/providers/$(WIF_PROVIDER_NAME) \
        --service-account=$(GCP_SERVICE_ACCOUNT) \
        --output-file=$(System.DefaultWorkingDirectory)/gcp-credentials.json \
        --credential-source-file=$(System.DefaultWorkingDirectory)/oidc-token.txt

      echo "Validate google API credential.json"

      # 3. Export credentials for the Google SDK to consume
      ls -lrt $(System.DefaultWorkingDirectory)/gcp-credentials.json

      export GOOGLE_APPLICATION_CREDENTIALS=$(System.DefaultWorkingDirectory)/gcp-credentials.json
      echo $GOOGLE_APPLICATION_CREDENTIALS
      cat $(System.DefaultWorkingDirectory)/gcp-credentials.json

      # 4. Log into GCP (Using --quiet to prevent the terminal from freezing)
      echo "Google Auth login"

      gcloud auth login --cred-file=$GOOGLE_APPLICATION_CREDENTIALS --quiet

      echo "Google config set"

      gcloud config set project $(GCP_PROJECT_ID) --quiet
      
      echo "Authentication successful!"
      
      # 5. Test command to validate deployment capabilities
      echo "Google storage list"
      
      gcloud storage ls