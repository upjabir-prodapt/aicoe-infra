trigger:
  branches:
    include:
      - main
  paths:
    include:
      - AICOE-Terraform/* 
pr:
  branches:
    include:
      - main
  paths:
    include:
      - AICOE-Terraform/*
pool:
  vmImage: 'ubuntu-latest'

variables:
  # --- Azure WIF Service Connection ---
  - name: Azure.WorkloadIdentity.Connection
    value: 'sc-ado-gcp-aicoe'
 
  # --- GCP WIF Configuration ---
  - name: GoogleCloud.WorkloadIdentity.ProjectNumber
    value: '297743845367'
  - name: GoogleCloud.WorkloadIdentity.Pool
    value: 'aicoe-ado-wip'
  - name: GoogleCloud.WorkloadIdentity.Provider
    value: 'aicoe-ado-wip-provider'
  - name: GoogleCloud.WorkloadIdentity.ServiceAccount
    value: 'aicoe-sbx-wif-sa-tf@aicoesandox.iam.gserviceaccount.com'
 
  # --- Terraform Runtime Variables ---
  - name: GOOGLE_APPLICATION_CREDENTIALS
    value: '$(Pipeline.Workspace)/.workload_identity.wlconfig'
  - name: TF_ENV
    value: 'sandox'                        # Override per environment: dev / staging / prod
  - name: TF_PROJECT
    value: 'aicoe'
  - name: TF_REGION
    value: 'europe-west1'
  - name: TERRAFORM_ROOT
    value: '$(Build.SourcesDirectory)/aicoe-terraform/terraform'
  - name: SKIP_INTERACTIVE_SAFETY_PROMPT
    value: 'true'                       # Required for non-interactive CI pipeline

stages:
- stage: __default
  jobs:
  - job: Job
    
    steps:
    - task: AzureCLI@2
      displayName: 'Passwordless WIF Authentication to GCP'
      inputs:
        azureSubscription: $(ADO_SERVICE_CONNECTION_NAME)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          echo "Starting passwordless authentication to GCP..."
          # 1. Save the ADO OIDC token to a temporary file
          echo $idToken > $(System.DefaultWorkingDirectory)/oidc-token.txt
          # 2. Create the dynamic JSON configuration file for WIF
          gcloud iam workload-identity-pools create-cred-config \
            projects/$(GCP_PROJECT_NUMBER)/locations/global/workloadIdentityPools/$(WIF_POOL_NAME)/providers/$(WIF_PROVIDER_NAME) \
            --service-account=$(GCP_SERVICE_ACCOUNT) \
            --output-file=$(System.DefaultWorkingDirectory)/gcp-credentials.json \
            --credential-source-file=$(System.DefaultWorkingDirectory)/oidc-token.txt
          # 3. Export credentials for the Google SDK to consume
          export GOOGLE_APPLICATION_CREDENTIALS=$(System.DefaultWorkingDirectory)/gcp-credentials.json
          # 4. Log into GCP (Using --quiet to prevent the terminal from freezing)
          gcloud auth login --cred-file=$GOOGLE_APPLICATION_CREDENTIALS --quiet
          gcloud config set project $GCP_PROJECT_ID --quiet
          gcloud config list
          gcloud storage ls
