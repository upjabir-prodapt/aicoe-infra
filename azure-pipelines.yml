trigger:
- main
pool:
  vmImage: 'ubuntu-latest' # Uses Microsoft's free hosted servers
variables:
  GCP_PROJECT_ID: 'aicoe-sharedwif'
  GCP_PROJECT_NUMBER: '538669417284' # 12-digit number
  GCP_SERVICE_ACCOUNT: 'aicoe-shared-wip-sa-tf@aicoe-sharedwif.iam.gserviceaccount.com'
  ADO_SERVICE_CONNECTION_NAME: 'sc-ado-gcp-aicoe' # Exact name of your Service Connection
  WIF_POOL_NAME: 'aicoe-ado-wip'
  WIF_PROVIDER_NAME: 'ado-gcp-wif'
steps:
- task: AzureCLI@2
  displayName: 'Passwordless WIF Authentication to GCP'
  inputs:
    azureSubscription: $(ADO_SERVICE_CONNECTION_NAME) 
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    addSpnToEnvironment: true # Crucial: injects the OIDC token into the $idToken variable
    inlineScript: |
      echo "Starting passwordless authentication to GCP..."

      # 1. Save the ADO OIDC token to a temporary file
      echo $idToken > $(System.DefaultWorkingDirectory)/oidc-token.txt

      ls -lrt $(System.DefaultWorkingDirectory)/oidc-token.txt
      
     
      #1. Verify the token file is non-empty and freshly written 
      cat /home/vsts/work/1/s/oidc-token.txt | wc -c
      # 2. Decode and check iss + aud claims 
      cat /home/vsts/work/1/s/oidc-token.txt | cut -d'.' -f2 | base64 -d 2>/dev/null | python3 -m json.tool